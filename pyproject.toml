[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-latent-manifold-study"
version = "0.1.0"
description = "Latent-geometry benchmark for parameterized quantum circuits"
readme = "README_PYTHON.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "tqdm>=4.66",
  "pennylane>=0.40",
  "umap-learn>=0.5.6",
]

[tool.setuptools.packages.find]
include = ["pqc_latent*"]
