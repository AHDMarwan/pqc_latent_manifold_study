name: Run corrected PQC latent-manifold study

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Experiment scale
        required: true
        default: publication
        type: choice
        options:
          - publication
          - default
  push:
    branches:
      - main
    paths:
      - "pqc_latent/**"
      - "run_experiment.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/run-pqc.yml"

permissions:
  contents: write

concurrency:
  group: corrected-pqc-latent-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"
  PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'publication' }}

jobs:
  validate:
    name: Tests and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Corrected quantum smoke run
        run: |
          rm -rf smoke_results smoke_results.zip
          python run_experiment.py --smoke --no-umap --output-dir smoke_results
          test -f smoke_results/analysis_summary.json

      - name: Record validation status
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "status": os.environ.get("VALIDATION_STATUS"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path("results/ci_validation_status.json").write_text(
              json.dumps(payload, indent=2), encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ci_validation_status.json
          git commit -m "Record corrected PQC validation status [skip ci]" || true
          git push

  simulate:
    name: Simulate ${{ matrix.family }} / ${{ matrix.qubits }} qubits
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        qubits: [4, 6, 8]
        family: [hea_line, hea_ring, brickwall, ttn, symmetry_xy]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate descriptor shard
        run: |
          rm -rf shard_results
          if [ "$PROFILE" = "publication" ]; then
            SCALE="--publication"
          else
            SCALE=""
          fi
          python run_experiment.py \
            $SCALE \
            --generate-only \
            --qubits "${{ matrix.qubits }}" \
            --families "${{ matrix.family }}" \
            --output-dir shard_results
          test -f shard_results/pqc_descriptor_dataset.csv

      - name: Upload descriptor shard
        uses: actions/upload-artifact@v4
        with:
          name: pqc-shard-${{ matrix.family }}-q${{ matrix.qubits }}
          path: shard_results/pqc_descriptor_dataset.csv
          if-no-files-found: error
          retention-days: 30

  analyze:
    name: Merge, analyze, and store results
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Fast-forward to validation status commit
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download all descriptor shards
        uses: actions/download-artifact@v4
        with:
          pattern: pqc-shard-*
          path: shards

      - name: Merge shards and run corrected analysis
        run: |
          rm -rf results results.zip
          mapfile -t FILES < <(find shards -name pqc_descriptor_dataset.csv -type f | sort)
          echo "Found ${#FILES[@]} descriptor shards"
          test "${#FILES[@]}" -eq 15

          if [ "$PROFILE" = "publication" ]; then
            SCALE="--publication"
          else
            SCALE=""
          fi

          python run_experiment.py \
            $SCALE \
            --analyze-csv "${FILES[@]}" \
            --output-dir results

          if [ -f results.zip ]; then
            mv results.zip results/pqc_latent_results.zip
          fi

      - name: Add run metadata
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "implementation": "corrected_multi_file_python",
              "profile": os.environ.get("PROFILE"),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "python": platform.python_version(),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "simulation_shards": 15,
              "qubit_counts": [4, 6, 8],
              "families": [
                  "hea_line", "hea_ring", "brickwall", "ttn", "symmetry_xy"
              ],
          }
          Path("results/run_metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload final results artifact
        uses: actions/upload-artifact@v4
        with:
          name: pqc-latent-results-corrected-${{ env.PROFILE }}
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Commit final results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Store corrected PQC publication results [skip ci]"
            git push
          fi
